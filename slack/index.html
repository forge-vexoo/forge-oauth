<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Signing in to Forge</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0b0d12; color: #e6e8ee; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { text-align: center; max-width: 380px; padding: 32px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #9aa0ab; margin: 0; }
  a { color: #8ab4ff; }
</style>
</head>
<body>
<div class="card">
  <h1>Finishing sign-in…</h1>
  <p id="msg">Returning to the Forge app on this computer.</p>
</div>
<script>
  // Slack redirects here (HTTPS) with ?code=…&state=… — hand them to the Forge
  // app's local sign-in listener. Nothing is stored or sent anywhere else; the
  // code is useless without the PKCE verifier held by the Forge app.
  var target = "http://127.0.0.1:47815/oauth/callback" + window.location.search;
  window.location.replace(target);
  setTimeout(function () {
    document.getElementById("msg").innerHTML =
      'If nothing happens, make sure Forge is open, then <a href="' + target.replace(/"/g, "&quot;") + '">click here</a>.';
  }, 2500);
</script>
</body>
</html>
